<h2 mat-dialog-title>{{ isEditMode ? 'Edit' : 'Add' }} Category</h2>

<mat-dialog-content>
    <form [formGroup]="categoryForm">
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" placeholder="Enter category name" required>
            <mat-error *ngIf="categoryForm.get('name')?.hasError('required')">
                Name is required
            </mat-error>
            <mat-error *ngIf="categoryForm.get('name')?.hasError('maxlength')">
                Name cannot exceed 100 characters
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description</mat-label>
            <textarea matInput 
                      formControlName="description" 
                      placeholder="Enter category description"
                      rows="3"></textarea>
            <mat-error *ngIf="categoryForm.get('description')?.hasError('maxlength')">
                Description cannot exceed 500 characters
            </mat-error>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-raised-button 
            color="primary" 
            (click)="onSubmit()"
            [disabled]="!categoryForm.valid">
        {{ isEditMode ? 'Update' : 'Create' }}
    </button>
</mat-dialog-actions>
